[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odysseus"
dynamic = ["version"]
description = "Music discovery and metadata-aware download tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Odysseus contributors"}]
dependencies = [
    "mutagen>=1.45.0",
    "requests>=2.25.0",
    "rich>=13.0.0",
    "yt-dlp>=2023.12.30",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
gui = [
    "keyring>=25.0.0",
    "PySide6>=6.8,<7",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.6",
]

[project.scripts]
odysseus = "odysseus.main:main"

[project.gui-scripts]
odysseus-gui = "odysseus.ui.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "odysseus.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"odysseus.ui.gui" = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=odysseus",
    "--cov-report=term-missing",
    "--cov-branch",
    "--cov-fail-under=45",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
pretty = true
show_error_codes = true
# Enforce typing on modules introduced or heavily touched by the layering refactor.
files = [
    "src/odysseus/domain/music/download/presenter.py",
    "src/odysseus/ui/download_presenter.py",
    "src/odysseus/domain/music/download/strategies/full_album",
    "src/odysseus/domain/music/search/release_snapshot.py",
    "src/odysseus/domain/music/search/release_candidate_fetcher.py",
    "src/odysseus/domain/music/search/release_ranker.py",
    "src/odysseus/domain/music/search/release_search_cache.py",
    "src/odysseus/domain/music/search/youtube_catalog_search.py",
    "src/odysseus/core/http/network_agent.py",
]

[[tool.mypy.overrides]]
module = [
    "odysseus.domain.music.download.strategies.full_album.*",
    "odysseus.domain.music.search.release_candidate_fetcher",
    "odysseus.domain.music.search.youtube_catalog_search",
]
# Collaborators still use MagickMock-friendly dynamic attrs from legacy clients.
disable_error_code = [
    "attr-defined",
    "arg-type",
    "assignment",
    "union-attr",
    "return-value",
    "call-overload",
]
