[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odysseus"
dynamic = ["version"]
description = "Music discovery and metadata-aware download tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Odysseus contributors"}]
dependencies = [
    "mutagen>=1.45.0",
    "requests>=2.25.0",
    "rich>=13.0.0",
    "yt-dlp>=2023.12.30",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
gui = [
    "keyring>=25.0.0",
    "PySide6>=6.8,<7",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.6",
]

[project.scripts]
odysseus = "odysseus.main:main"

[project.gui-scripts]
odysseus-gui = "odysseus.ui.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "odysseus.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"odysseus.ui.gui" = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=odysseus",
    "--cov-report=term-missing",
    "--cov-branch",
    "--cov-fail-under=25",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
